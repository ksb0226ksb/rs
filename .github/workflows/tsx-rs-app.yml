name: TSX RS Rating Calculator

on:
  schedule:
    - cron: "45 21 * * 1-5"  # 9:45 PM UTC = 4:45 PM EST (after TSX close, 30 min after NASDAQ)
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Run TSX script
        env:
          TEST_MODE: "true"  # Set to "false" for full run (260+ stocks, ~5 min)
        run: uv run ./calc-tsx-rs.py
        continue-on-error: true  # Don't fail if TSX has issues
      - name: Commit changes
        run: |
          git config --local user.email "ksb0226ksb@gmail.com"
          git config --local user.name "ksb0226ksb"
          git add .
          git commit -m "[AUTO] Daily TSX RS rating" || echo "No changes to commit"
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          branch: "main"
          github_token: ${{ secrets.GITHUB_TOKEN }}
