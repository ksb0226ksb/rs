name: TSX RS Rating Calculator

on:
  schedule:
    - cron: "45 21 * * 1-5"  # 9:45 PM UTC = 4:45 PM EST (after TSX close, 30 min after NASDAQ)
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Run TSX script
        env:
          TEST_MODE: "false"  # Set to "true" for test run (20 stocks, ~2 min)
        run: uv run ./calc-tsx-rs.py
        continue-on-error: true  # Don't fail if TSX has issues
      - name: Commit and push changes
        run: |
          git config --local user.email "ksb0226ksb@gmail.com"
          git config --local user.name "ksb0226ksb"
          git add .
          git commit -m "[AUTO] Daily TSX RS rating" || echo "No changes to commit"
          git pull --rebase origin main || echo "Already up to date"
          git push origin main
