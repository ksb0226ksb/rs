name: NASDAQ RS Rating Calculator

on:
  schedule:
    - cron: "15 21 * * 1-5"  # 9:15 PM UTC = 4:15 PM EST (after NASDAQ close)
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Run NASDAQ script
        env:
          TEST_MODE: "false"  # Set to "true" for test run (20 stocks, ~2 min)
        run: uv run ./calc-nasdaq-rs.py
      - name: Commit and push changes
        run: |
          git config --local user.email "ksb0226ksb@gmail.com"
          git config --local user.name "ksb0226ksb"
          git add .
          git commit -m "[AUTO] Daily NASDAQ RS rating" || echo "No changes to commit"
          git pull --rebase origin main || echo "Already up to date"
          git push origin main
