name: NYSE RS Rating Calculator

on:
  schedule:
    - cron: "30 21 * * 1-5"  # 9:30 PM UTC = 4:30 PM EST (after NYSE close, 15 min after NASDAQ)
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Run NYSE script
        env:
          TEST_MODE: "true"  # Set to "false" for full run (2700+ stocks, ~45 min)
        run: uv run ./calc-nyse-rs.py
      - name: Commit and push changes
        run: |
          git config --local user.email "ksb0226ksb@gmail.com"
          git config --local user.name "ksb0226ksb"
          git add .
          git commit -m "[AUTO] Daily NYSE RS rating" || echo "No changes to commit"
          git pull --rebase origin main || echo "Already up to date"
          git push origin main
